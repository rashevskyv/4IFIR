name: "4IFIR Wizard Package Release"

on:
  workflow_dispatch:

jobs:
  Wizard-Update:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          sed -i "s/;version='[0-9.]*'/;version='$(date '+%y.%m.%d.%H')'/g" "4IFIR-Wizard/package/config.ini"
          sed -i "s/;version='[0-9.]*'/;version='$(date '+%y.%m.%d.%H')'/g" "4IFIR-Wizard/package/4Advanced/Full Assist/inis/Start.ini"
          zip -r "4IFIR-Wizard/4IFIR-Wizard-update/4IFIR\ Wizard/files.zip" "4IFIR-Wizard/package/*"
          zip -r "4IFIR-Wizard/4IFIR-Wizard-update/4IFIR-Wizard-update-$(date '+%y.%m.%d.%H').zip" "4IFIR-Wizard/4IFIR-Wizard-update/4IFIR\ Wizard"
          - id: tag_name

      - name: Add version
        run: echo "version=$(date '+%y.%m.%d.%H')" >> "$GITHUB_OUTPUT"
        env:
          TAG_NAME: test

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          tag_name: ${{ steps.tag_name.outputs.version }}
          generate_release_notes: true
          files: 4IFIR-Wizard-update/4IFIR-Wizard-update-*.zip
